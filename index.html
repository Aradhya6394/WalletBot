<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalletBot</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{

      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background: linear-gradient(135deg,#141e30,#243b55);

    }

    .container{

      width:900px;
      height:600px;

      background: rgba(255,255,255,0.08);

      border-radius:20px;

      backdrop-filter: blur(10px);

      box-shadow:0 8px 32px rgba(0,0,0,0.3);

      display:flex;

      overflow:hidden;

    }

    .left{

      width:40%;

      padding:40px;

      color:white;

      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .left h1{

      font-size:48px;
      margin-bottom:20px;

    }

    .left p{

      font-size:18px;
      line-height:1.6;

      color:#ddd;
    }

    .right{

      width:60%;

      background:white;

      position:relative;

    }

    df-messenger{

      --df-messenger-bot-message: #1e88e5;
      --df-messenger-button-titlebar-color: #141e30;
      --df-messenger-chat-background-color: #f5f5f5;
      --df-messenger-font-color: white;
      --df-messenger-send-icon: #141e30;
      --df-messenger-user-message: #4caf50;

      position:absolute;

      width:100%;
      height:100%;

      top:0;
      left:0;

    }

    df-messenger-chat{

      height:100%;
      width:100%;

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="left">

      <h1>💰 WalletBot</h1>

      <p>
        Convert currencies instantly.
        Get live exchange rates in a modern conversational interface.
      </p>

    </div>

    <div class="right">

      <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

      <df-messenger
        intent="WELCOME"
        chat-title="WalletBot"
        agent-id="a7762946-e97e-4833-992c-d23a891fd185"
        language-code="en">
      </df-messenger>

    </div>

  </div>

</body>

</html>
